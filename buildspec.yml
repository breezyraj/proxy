version: 0.2
env:
  variables:
    IMAGE_TAG: "latest"
phases:
  pre_build:
    commands:
      - echo "Logging into ECR Public"
      - aws ecr-public get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin public.ecr.aws
      - echo "Logging into private ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - ECR_BASE=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - echo "Building $APP_NAME"
      - docker build -t $APP_NAME:$IMAGE_TAG .
      - docker tag $APP_NAME:$IMAGE_TAG $ECR_BASE/$APP_NAME:$IMAGE_TAG
  post_build:
    commands:
      - echo "Pushing $APP_NAME"
      - docker push $ECR_BASE/$APP_NAME:$IMAGE_TAG
      - echo "Done"
artifacts:
  files:
    - appspec.yml
    - scripts/**/*
